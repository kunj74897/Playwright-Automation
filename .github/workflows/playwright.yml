
name: Playwright Tests

on:
  # Daily execution at 07:00 AM IST
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Kolkata'

  # Manual execution
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to execute'
        required: true
        type: choice
        options:
          - main
          - feature

      tag:
        description: 'Select test tag to execute'
        required: true
        type: choice
        default: all
        options:
          - all
          - '@smoke'
          - '@regression'
          - '@sanity'

      test_file:
        description: 'Enter test file path (leave empty to run all files)'
        required: false
        type: string
        default: ''

      test_case:
        description: 'Enter test case name (leave empty to run all cases)'
        required: false
        type: string
        default: ''

      browser:
        description: 'Select browser'
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit

      workers:
        description: 'Select number of workers'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '4'

      retries:
        description: 'Select retry count'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - '2'

      report:
        description: 'Select report format'
        required: true
        type: choice
        default: html
        options:
          - html
          - json
          - junit

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TEST_TAG: ${{ inputs.tag || 'all' }}
      TEST_FILE: ${{ inputs.test_file || '' }}
      TEST_CASE: ${{ inputs.test_case || '' }}

      PLAYWRIGHT_BROWSER: ${{ inputs.browser || 'chromium' }}
      PLAYWRIGHT_WORKERS: ${{ inputs.workers || '1' }}
      PLAYWRIGHT_RETRIES: ${{ inputs.retries || '0' }}
      PLAYWRIGHT_REPORT: ${{ inputs.report || 'html' }}

    steps:
      # Checkout selected branch
      - name: Checkout Selected Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install selected Playwright browser
      - name: Install Playwright Browser
        run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSER"

      # Execute selected test cases
      - name: Execute Selected Test Cases
        shell: bash
        run: |
          args=()
          grep_pattern=""

          if [ -n "$TEST_FILE" ]; then
            args+=("$TEST_FILE")
          fi

          if [ "$TEST_TAG" != "all" ]; then
            grep_pattern="(?=.*${TEST_TAG})"
          fi

          if [ -n "$TEST_CASE" ]; then
            grep_pattern="${grep_pattern}(?=.*${TEST_CASE})"
          fi

          if [ -n "$grep_pattern" ]; then
            args+=(--grep "$grep_pattern")
          fi

          npx playwright test "${args[@]}" \
            --project="$PLAYWRIGHT_BROWSER" \
            --workers="$PLAYWRIGHT_WORKERS" \
            --retries="$PLAYWRIGHT_RETRIES"

      # Upload HTML report
      - name: Upload Playwright HTML Report
        if: ${{ always() && !cancelled() && env.PLAYWRIGHT_REPORT == 'html' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # Upload JSON report
      - name: Upload Playwright JSON Report
        if: ${{ always() && !cancelled() && env.PLAYWRIGHT_REPORT == 'json' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: test-results/results.json
          retention-days: 30
          if-no-files-found: ignore

      # Upload JUnit report
      - name: Upload Playwright JUnit Report
        if: ${{ always() && !cancelled() && env.PLAYWRIGHT_REPORT == 'junit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: test-results/results.xml
          retention-days: 30
          if-no-files-found: ignore

      # Upload test results
      - name: Upload test results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      # Prepare selected report for email
      - name: Prepare Playwright Report for Email
        id: prepare_report
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          case "$PLAYWRIGHT_REPORT" in
            html)
              if [ -d playwright-report ]; then
                zip -qr email-report.zip playwright-report/
              fi
              ;;
            json)
              if [ -f test-results/results.json ]; then
                zip -q email-report.zip test-results/results.json
              fi
              ;;
            junit)
              if [ -f test-results/results.xml ]; then
                zip -q email-report.zip test-results/results.xml
              fi
              ;;
          esac

          if [ -s email-report.zip ]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Send report to both email addresses
      - name: Send Playwright Report via Gmail
        if: ${{ always() && !cancelled() && steps.prepare_report.outputs.report_exists == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          from: ${{ secrets.GMAIL_USERNAME }}
          to: kunj1736@gmail.com,jayesh@qable.io

          subject: Playwright Execution Report - ${{ job.status }}

          body: |
            Hello,

            Playwright test execution has been completed.

            Repository: ${{ github.repository }}
            Branch: main or selected manual branch
            Browser: ${{ env.PLAYWRIGHT_BROWSER }}
            Selected Tag: ${{ env.TEST_TAG }}
            Workers: ${{ env.PLAYWRIGHT_WORKERS }}
            Retries: ${{ env.PLAYWRIGHT_RETRIES }}
            Report Format: ${{ env.PLAYWRIGHT_REPORT }}
            Workflow Status: ${{ job.status }}

            Please find the Playwright execution report attached.

            Regards,
            Automation Testing Team

          attachments: email-report.zip
