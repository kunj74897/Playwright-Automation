
name: Playwright Tests

on:
  # push:
  #   branches: [main, feature]

  # pull_request:
  #   branches: [main, feature]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to execute'
        required: true
        type: choice
        options:
          - main
          - feature

      tag:
        description: 'Select test tag to execute'
        required: true
        type: choice
        default: all
        options:
          - all
          - '@smoke'
          - '@regression'
          - '@sanity'

      test_file:
        description: 'Enter test file path (leave empty to run all files)'
        required: false
        type: string
        default: ''

      test_case:
        description: 'Enter test case name (leave empty to run all cases)'
        required: false
        type: string
        default: ''

      browser:
        description: 'Select browser'
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit

      workers:
        description: 'Select number of workers'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '4'

      retries:
        description: 'Select retry count'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - '2'

      report:
        description: 'Select report format'
        required: true
        type: choice
        default: html
        options:
          - html
          - json
          - junit

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TEST_TAG: ${{ inputs.tag || 'all' }}
      TEST_FILE: ${{ inputs.test_file }}
      TEST_CASE: ${{ inputs.test_case }}

      PLAYWRIGHT_BROWSER: ${{ inputs.browser || 'chromium' }}
      PLAYWRIGHT_WORKERS: ${{ inputs.workers || '1' }}
      PLAYWRIGHT_RETRIES: ${{ inputs.retries || '0' }}
      PLAYWRIGHT_REPORT: ${{ inputs.report || 'html' }}

    steps:
      # Checkout selected branch
      - name: Checkout Selected Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install selected Playwright browser
      - name: Install Playwright Browser
        run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSER"

      # Execute selected test cases
      - name: Execute Selected Test Cases
        shell: bash
        run: |
          args=()
          grep_pattern=""

          if [ -n "$TEST_FILE" ]; then
            args+=("$TEST_FILE")
          fi

          if [ "$TEST_TAG" != "all" ]; then
            grep_pattern="(?=.*${TEST_TAG})"
          fi

          if [ -n "$TEST_CASE" ]; then
            grep_pattern="${grep_pattern}(?=.*${TEST_CASE})"
          fi

          if [ -n "$grep_pattern" ]; then
            args+=(--grep "$grep_pattern")
          fi

          npx playwright test "${args[@]}"

      # Upload HTML report
      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() && env.PLAYWRIGHT_REPORT == 'html' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # Upload JSON report
      - name: Upload Playwright JSON Report
        if: ${{ !cancelled() && env.PLAYWRIGHT_REPORT == 'json' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: test-results/results.json
          retention-days: 30
          if-no-files-found: ignore

      # Upload JUnit report
      - name: Upload Playwright JUnit Report
        if: ${{ !cancelled() && env.PLAYWRIGHT_REPORT == 'junit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: test-results/results.xml
          retention-days: 30
          if-no-files-found: ignore

      # Upload test results
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
