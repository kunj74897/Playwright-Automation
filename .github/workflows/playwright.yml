
name: Playwright Tests

on:
  push:
    branches: [main, feature]

  pull_request:
    branches: [main, feature]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to execute'
        required: true
        type: choice
        options:
          - main
          - feature

      tag:
        description: 'Select test tag to execute'
        required: true
        type: choice
        default: all
        options:
          - all
          - '@smoke'
          - '@regression'
          - '@sanity'

      test_file:
        description: 'Enter test file path (leave empty to run all files)'
        required: false
        type: string
        default: ''

      test_case:
        description: 'Enter test case name (leave empty to run all cases)'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Checkout selected branch
      - name: Checkout Selected Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Execute selected test cases
      - name: Execute Selected Test Cases
        env:
          TEST_TAG: ${{ inputs.tag || 'all' }}
          TEST_FILE: ${{ inputs.test_file }}
          TEST_CASE: ${{ inputs.test_case }}
        run: |
          args=()

          if [ -n "$TEST_FILE" ]; then
            args+=("$TEST_FILE")
          fi

          if [ "$TEST_TAG" != "all" ]; then
            args+=(--grep "$TEST_TAG")
          fi

          if [ -n "$TEST_CASE" ]; then
            args+=(--grep "$TEST_CASE")
          fi

          npx playwright test "${args[@]}"

      # Upload Playwright report
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # Upload test results
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
